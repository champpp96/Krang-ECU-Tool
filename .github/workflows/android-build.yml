name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install packages
        run: | yes | sdkmanager --licenses >/dev/null || true sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" 
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show build tool versions
        run: | java -version gradle --version adb version 
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Create APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: KrangEcuTool-debug-apk
          path: | app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug.apk.sha256           if-no-files-found: error
          retention-days: 14